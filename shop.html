<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | OSAARA NATURALS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
    .page-header {
      background-color: var(--color-bg-ivory);
      padding: var(--space-8) 0;
      text-align: center;
      border-bottom: 1px solid var(--color-border);
    }
    
    .page-header h1 {
      font-size: var(--text-3xl);
      margin-bottom: var(--space-2);
    }
    
    .shop-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-8);
      padding: var(--space-8) 0;
    }
    
    @media (min-width: 1024px) {
      .shop-layout {
        grid-template-columns: 250px 1fr;
      }
    }
    
    /* Filters Sidebar */
    .filters-section {
      background: var(--color-bg-ivory);
      padding: var(--space-6);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }
    
    @media (max-width: 1023px) {
      .filters-section {
        display: none; /* Hidden on mobile by default */
        position: fixed;
        inset: 0;
        z-index: 200;
        border-radius: 0;
        border: none;
        overflow-y: auto;
      }
      
      .filters-section.active {
        display: block;
      }
    }
    
    .filters-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--color-border);
    }
    
    .filter-group {
      margin-bottom: var(--space-6);
    }
    
    .filter-group h3 {
      font-size: var(--text-base);
      margin-bottom: var(--space-3);
    }
    
    .filter-option {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
      cursor: pointer;
    }
    
    .filter-option input[type="radio"] {
      accent-color: var(--color-primary-dark);
      width: 1.1em;
      height: 1.1em;
    }

    .search-bar {
      width: 100%;
      padding: var(--space-2) var(--space-4);
      border: 1px solid var(--color-border-dark);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-4);
      font-size: var(--text-sm);
    }
    
    /* Products Area */
    .shop-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
      gap: var(--space-4);
    }
    
    .sort-select {
      padding: var(--space-2);
      border: 1px solid var(--color-border-dark);
      border-radius: var(--radius-sm);
      background-color: var(--color-bg-light);
      font-size: var(--text-sm);
    }

    .mobile-filter-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    @media (min-width: 1024px) {
      .mobile-filter-btn {
        display: none;
      }
      .filters-header .close-filters {
        display: none;
      }
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-4);
    }
    
    @media (min-width: 768px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-6);
      }
    }
    
    @media (min-width: 1200px) {
      .product-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container navbar">
      <button class="mobile-menu-toggle" aria-label="Open Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <a href="index.html" class="brand-logo">
        <span class="brand-name">OSAARA</span>
        <span class="brand-sub">NATURALS</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link" style="color: var(--color-primary);">Shop</a>
        <a href="about.html" class="nav-link">Our Story</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="cart-toggle" aria-label="View Cart">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" style="display:none;">0</span>
        </a>
      </div>
    </div>
  </header>
  
  <!-- Mobile Menu (omitted for brevity, assume JS clones or we duplicate) -->
  <div class="mobile-menu">
    <div class="mobile-menu-header">
      <div class="brand-logo">
        <span class="brand-name">OSAARA</span>
        <span class="brand-sub">NATURALS</span>
      </div>
      <button class="mobile-menu-close btn" aria-label="Close Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <nav class="mobile-nav-links">
      <a href="index.html" class="mobile-nav-link">Home</a>
      <a href="shop.html" class="mobile-nav-link">Shop All</a>
      <a href="about.html" class="mobile-nav-link">Our Story</a>
      <a href="contact.html" class="mobile-nav-link">Contact Us</a>
    </nav>
  </div>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>Shop All Products</h1>
        <p class="text-muted">Discover our complete range of traditional natural goodness.</p>
      </div>
    </div>

    <div class="container shop-layout">
      <!-- Filters Sidebar -->
      <aside class="filters-section" id="filters-sidebar">
        <div class="filters-header">
          <h2>Filters</h2>
          <button class="btn close-filters" id="close-filters-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        
        <input type="text" id="search-input" class="search-bar" placeholder="Search products, ingredients...">
        
        <div class="filter-group">
          <h3>Categories</h3>
          <label class="filter-option">
            <input type="radio" name="category" value="all" checked>
            <span>All Products</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="category" value="Health & Nutrition">
            <span>Health & Nutrition</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="category" value="Hair Care">
            <span>Hair Care</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="category" value="Face & Skin Care">
            <span>Face & Skin Care</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="category" value="Combos">
            <span>Combos</span>
          </label>
        </div>
      </aside>

      <!-- Products Area -->
      <section>
        <div class="shop-toolbar">
          <button class="btn btn-secondary btn-sm mobile-filter-btn" id="open-filters-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            Filter
          </button>
          
          <div style="margin-left: auto; display: flex; align-items: center; gap: var(--space-2);">
            <label for="sort" class="text-sm">Sort by:</label>
            <select id="sort-select" class="sort-select">
              <option value="featured">Featured</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="name">Name</option>
            </select>
          </div>
        </div>
        
        <p id="results-count" class="text-muted text-sm" style="margin-bottom: var(--space-4);"></p>
        
        <div class="product-grid" id="shop-products-container">
          <!-- Populated by JS -->
          <p class="text-center text-muted" style="grid-column: 1/-1;">Loading catalog...</p>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <!-- Simplified footer structure for brevity, assuming standard layout -->
    <div class="container text-center">
      <p>&copy; <span id="current-year">2026</span> OSAARA NATURALS. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
