<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | OSAARA NATURALS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
    .breadcrumb {
      padding: var(--space-4) 0;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    
    .breadcrumb a {
      color: var(--color-text-main);
    }
    
    .breadcrumb a:hover {
      text-decoration: underline;
    }
    
    /* Product Main Area */
    .product-main {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-8);
      margin-bottom: var(--space-12);
    }
    
    @media (min-width: 768px) {
      .product-main {
        grid-template-columns: 1fr 1fr;
        gap: var(--space-12);
      }
    }
    
    /* Gallery */
    .product-gallery {
      position: relative;
    }
    
    .main-image {
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      background: var(--color-bg-ivory);
      overflow: hidden;
      margin-bottom: var(--space-4);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    
    .main-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    /* Info Area */
    .product-info {
      position: sticky;
      top: 2rem;
    }
    .product-category {
      color: var(--color-primary);
      text-transform: uppercase;
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-2);
    }
    
    .product-title {
      font-size: var(--text-2xl);
      margin-bottom: var(--space-2);
    }
    
    .product-description-short {
      font-size: var(--text-base);
      color: var(--color-text-muted);
      margin-bottom: var(--space-6);
    }
    
    .product-pricing {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-6);
      border-bottom: 1px solid var(--color-border);
    }
    
    .price-current {
      font-size: var(--text-2xl);
      font-weight: 600;
      color: var(--color-text-main);
    }
    
    .price-mrp {
      text-decoration: line-through;
      color: var(--color-text-muted);
      font-size: var(--text-lg);
    }
    
    .price-discount {
      background: var(--color-accent-gold);
      color: var(--color-text-main);
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: 600;
    }
    
    /* Options Area */
    .option-group {
      margin-bottom: var(--space-6);
    }
    
    .option-label {
      display: block;
      font-weight: 600;
      margin-bottom: var(--space-2);
    }
    
    .weight-options {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }
    
    .weight-btn {
      padding: var(--space-2) var(--space-4);
      border: 1px solid var(--color-border-dark);
      background: transparent;
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .weight-btn.selected {
      border-color: var(--color-primary-dark);
      background: var(--color-primary-dark);
      color: var(--color-text-light);
    }
    
    .quantity-selector {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--color-border-dark);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    
    .qty-btn {
      width: 40px;
      height: 40px;
      background: var(--color-bg-ivory);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    
    .qty-btn:hover {
      background: var(--color-border);
    }
    
    .qty-input {
      width: 50px;
      height: 40px;
      text-align: center;
      border: none;
      border-left: 1px solid var(--color-border-dark);
      border-right: 1px solid var(--color-border-dark);
      background: transparent;
      font-weight: 600;
      -moz-appearance: textfield;
    }
    .qty-input::-webkit-outer-spin-button,
    .qty-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      margin-top: var(--space-8);
    }
    
    /* Product Details Layout */
    .details-section {
      border-top: 1px solid var(--color-border);
      padding-top: var(--space-12);
    }
    
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-8);
    }
    
    @media (min-width: 768px) {
      .detail-grid {
        grid-template-columns: 2fr 1fr;
      }
    }
    
    .detail-block {
      margin-bottom: var(--space-8);
    }
    
    .detail-block h3 {
      font-size: var(--text-lg);
      margin-bottom: var(--space-4);
      border-bottom: 2px solid var(--color-accent-gold);
      display: inline-block;
      padding-bottom: var(--space-1);
    }
    
    .detail-block ul {
      list-style-type: disc;
      padding-left: var(--space-4);
    }
    
    .detail-block li {
      margin-bottom: var(--space-2);
      color: var(--color-text-muted);
    }
    
    .meta-card {
      background: var(--color-bg-ivory);
      padding: var(--space-6);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }
    
    .meta-item {
      margin-bottom: var(--space-4);
    }
    
    .meta-item strong {
      display: block;
      font-size: var(--text-sm);
      color: var(--color-primary-dark);
      margin-bottom: 2px;
    }
    
    .meta-item span {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    
    /* Error State */
    .error-state {
      text-align: center;
      padding: var(--space-24) 0;
    }
  </style>
</head>
<body>

  <!-- Header (Same as index.html) -->
  <header class="site-header">
    <div class="container navbar">
      <button class="mobile-menu-toggle" aria-label="Open Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <a href="index.html" class="brand-logo">
        <span class="brand-name">OSAARA</span>
        <span class="brand-sub">NATURALS</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="about.html" class="nav-link">Our Story</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="cart-toggle" aria-label="View Cart">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" style="display:none;">0</span>
        </a>
      </div>
    </div>
  </header>
  
  <div class="mobile-menu">
    <div class="mobile-menu-header">
      <div class="brand-logo">
        <span class="brand-name">OSAARA</span>
        <span class="brand-sub">NATURALS</span>
      </div>
      <button class="mobile-menu-close btn" aria-label="Close Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <nav class="mobile-nav-links">
      <a href="index.html" class="mobile-nav-link">Home</a>
      <a href="shop.html" class="mobile-nav-link">Shop All</a>
      <a href="about.html" class="mobile-nav-link">Our Story</a>
      <a href="contact.html" class="mobile-nav-link">Contact Us</a>
    </nav>
  </div>

  <main class="container">
    <div id="product-content">
      <p class="text-center" style="padding: 100px 0;">Loading product...</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>&copy; <span id="current-year">2026</span> OSAARA NATURALS. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script> <!-- Will be created next -->
  <script src="js/whatsapp.js"></script> <!-- Will be created next -->
  <script src="js/product-page.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
