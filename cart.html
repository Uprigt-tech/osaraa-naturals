<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | OSAARA NATURALS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  
  <style>
    .page-header {
      background-color: var(--color-bg-ivory);
      padding: var(--space-8) 0;
      text-align: center;
      border-bottom: 1px solid var(--color-border);
    }
    
    .page-header h1 {
      font-size: var(--text-3xl);
      margin-bottom: var(--space-2);
    }
    
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-8);
      padding: var(--space-8) 0 var(--space-12);
    }
    
    @media (min-width: 1024px) {
      .cart-layout {
        grid-template-columns: 2fr 1fr;
        align-items: start;
      }
    }
    
    /* Cart Items Area */
    .cart-items-container {
      background: var(--color-bg-ivory);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      padding: var(--space-4);
    }
    
    @media (min-width: 768px) {
      .cart-items-container {
        padding: var(--space-6);
      }
    }
    
    .cart-item {
      display: flex;
      gap: var(--space-4);
      padding-bottom: var(--space-4);
      margin-bottom: var(--space-4);
      border-bottom: 1px solid var(--color-border);
    }
    
    .cart-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    
    .cart-item-image {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-sm);
      background: var(--color-bg-light);
      overflow: hidden;
      flex-shrink: 0;
    }
    
    .cart-item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .cart-item-details {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    
    .cart-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--space-1);
    }
    
    .cart-item-title {
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: var(--text-md);
      color: var(--color-primary-dark);
      margin-right: var(--space-2);
    }
    
    .cart-item-remove {
      color: var(--color-text-muted);
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
    }
    
    .cart-item-remove:hover {
      color: var(--color-error);
    }
    
    .cart-item-weight {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-bottom: auto;
    }
    
    .cart-item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: var(--space-4);
    }
    
    .cart-qty-controls {
      display: flex;
      align-items: center;
      border: 1px solid var(--color-border-dark);
      border-radius: var(--radius-sm);
      height: 32px;
    }
    
    .cart-qty-btn {
      width: 32px;
      height: 100%;
      background: transparent;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    
    .cart-qty-input {
      width: 40px;
      height: 100%;
      border: none;
      border-left: 1px solid var(--color-border-dark);
      border-right: 1px solid var(--color-border-dark);
      text-align: center;
      background: transparent;
      -moz-appearance: textfield;
    }
    .cart-qty-input::-webkit-outer-spin-button,
    .cart-qty-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    
    .cart-item-price {
      font-weight: 600;
      font-size: var(--text-base);
    }
    
    /* Cart Summary Area */
    .cart-summary {
      background: var(--color-primary-dark);
      color: var(--color-text-light);
      border-radius: var(--radius-md);
      padding: var(--space-6);
    }
    
    .summary-title {
      color: var(--color-accent-gold);
      font-family: var(--font-heading);
      font-size: var(--text-xl);
      margin-bottom: var(--space-6);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: var(--space-4);
    }
    
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--space-3);
      font-size: var(--text-sm);
    }
    
    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: var(--text-xl);
      font-weight: 600;
      color: var(--color-bg-ivory);
    }
    
    .checkout-btn {
      margin-top: var(--space-8);
    }
    
    /* Empty State */
    .empty-cart-state {
      text-align: center;
      padding: var(--space-12) 0;
    }
    
    .empty-cart-state h2 {
      font-size: var(--text-2xl);
      margin-bottom: var(--space-2);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container navbar">
      <button class="mobile-menu-toggle" aria-label="Open Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <a href="index.html" class="brand-logo">
        <span class="brand-name">OSAARA</span>
        <span class="brand-sub">NATURALS</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="about.html" class="nav-link">Our Story</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="cart-toggle" aria-label="View Cart">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" style="display:none;">0</span>
        </a>
      </div>
    </div>
  </header>
  
  <div class="mobile-menu">
    <div class="mobile-menu-header">
      <div class="brand-logo">
        <span class="brand-name">OSAARA</span>
        <span class="brand-sub">NATURALS</span>
      </div>
      <button class="mobile-menu-close btn" aria-label="Close Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <nav class="mobile-nav-links">
      <a href="index.html" class="mobile-nav-link">Home</a>
      <a href="shop.html" class="mobile-nav-link">Shop All</a>
      <a href="about.html" class="mobile-nav-link">Our Story</a>
      <a href="contact.html" class="mobile-nav-link">Contact Us</a>
    </nav>
  </div>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>Your Cart</h1>
      </div>
    </div>

    <div class="container">
      <div id="cart-content">
        <p class="text-center" style="padding: 100px 0;">Loading cart...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>&copy; <span id="current-year">2026</span> OSAARA NATURALS. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/whatsapp.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderCartPage();
    });
    
    function renderCartPage() {
      const container = document.getElementById('cart-content');
      const cart = window.CartAPI ? window.CartAPI.getCart() : [];
      
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart-state">
            <h2>Your cart is empty</h2>
            <p class="text-muted" style="margin-bottom: 2rem;">Looks like you haven't added any natural goodness yet.</p>
            <a href="shop.html" class="btn btn-primary">Explore Products</a>
          </div>
        `;
        return;
      }
      
      let itemsHtml = '';
      
      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        const imageHtml = item.image 
          ? `<img src="${item.image}" alt="${item.name}">`
          : `<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--color-bg-light); color: var(--color-primary-dark); font-size: 0.8rem; text-align: center; padding: 4px;">No img</div>`;
          
        itemsHtml += `
          <div class="cart-item">
            <a href="product.html?id=${item.id}" class="cart-item-image">
              ${imageHtml}
            </a>
            <div class="cart-item-details">
              <div class="cart-item-header">
                <a href="product.html?id=${item.id}" class="cart-item-title">${item.name}</a>
                <button class="cart-item-remove" onclick="removeCartItem(${index})" aria-label="Remove item">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
              <div class="cart-item-weight">Weight: ${item.weight}</div>
              
              <div class="cart-item-footer">
                <div class="cart-qty-controls">
                  <button class="cart-qty-btn" onclick="updateQty(${index}, ${item.quantity - 1})">-</button>
                  <input type="number" class="cart-qty-input" value="${item.quantity}" onchange="updateQty(${index}, this.value)">
                  <button class="cart-qty-btn" onclick="updateQty(${index}, ${item.quantity + 1})">+</button>
                </div>
                <div class="cart-item-price">${window.formatPrice(itemTotal)}</div>
              </div>
            </div>
          </div>
        `;
      });
      
      const totalAmount = window.CartAPI.getTotal();
      
      container.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items-container">
            ${itemsHtml}
          </div>
          
          <div class="cart-summary">
            <h2 class="summary-title">Order Summary</h2>
            <div class="summary-row">
              <span>Subtotal</span>
              <span>${window.formatPrice(totalAmount)}</span>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span>Calculated on WhatsApp</span>
            </div>
            
            <div class="summary-total">
              <span>Total</span>
              <span>${window.formatPrice(totalAmount)}</span>
            </div>
            
            <button class="btn btn-accent btn-block checkout-btn" onclick="window.WhatsAppAPI.checkoutCart()">Checkout on WhatsApp</button>
            
            <p style="font-size: 0.75rem; opacity: 0.8; margin-top: 1.5rem; text-align: center;">
              No payment is required right now. You will be redirected to WhatsApp to confirm your order details and delivery directly with us.
            </p>
          </div>
        </div>
      `;
    }
    
    function updateQty(index, qty) {
      let val = parseInt(qty, 10);
      if (isNaN(val) || val < 1) val = 1;
      if (val > 10) val = 10;
      
      window.CartAPI.updateQuantity(index, val);
      renderCartPage();
    }
    
    function removeCartItem(index) {
      window.CartAPI.removeItem(index);
      renderCartPage();
    }
  </script>
  <script src="js/animations.js"></script>
</body>
</html>
